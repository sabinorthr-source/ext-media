
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Extractor Multimedia</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 18px;
      font: 14px system-ui, sans-serif;
      background: #15171b;
      color: #f3f4f6;
    }
    h2 { margin: 0 0 8px; font-size: 19px; }
    p { color: #b8bdc7; line-height: 1.5; }
    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 7px;
      background: #3478f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Ext-Media · PeruTops</h2>
  <p>Recopila imágenes, videos, adjuntos, embeds y enlaces de todas las páginas accesibles del tema activo.</p>
  <button id="start">Extraer tema y abrir galería</button>
  <p id="status" role="status">Preparado.</p>
  <script src="popup.js"></script>
</body>
</html>
