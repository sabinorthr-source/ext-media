<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Extractor Multimedia</title>
  <style>
    body { width: 330px; margin: 0; padding: 18px; font: 14px system-ui, sans-serif; background: #15171b; color: #f3f4f6; }
    h2 { margin: 0 0 8px; font-size: 19px; }
    p { color: #b8bdc7; line-height: 1.45; }
    label { display: block; margin: 12px 0; color: #e5e7eb; }
    select { display: block; width: 100%; margin-top: 5px; padding: 8px; border-radius: 6px; }
    input { margin-right: 7px; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 7px; background: #3478f6; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { overflow-wrap: anywhere; }
    .hint { font-size: 12px; }
  </style>
</head>
<body>
  <h2>Extractor Multimedia</h2>
  <p>Recopila publicaciones y recursos de las páginas accesibles del tema actual.</p>
  <label><input id="linkedThreads" type="checkbox"> Explorar también temas enlazados (un nivel)</label>
  <label>Máximo de páginas por ejecución
    <select id="maxPages"><option value="500">500</option><option value="1000" selected>1.000</option><option value="2000">2.000</option><option value="5000">5.000</option></select>
  </label>
  <p class="hint">Las citas con imágenes o videos se incluyen y se identifican como contenido citado. Los temas enlazados solo se recorren si activas la opción.</p>
  <button id="start">Recorrer tema y abrir galería</button>
  <p id="status" role="status" aria-live="polite">Preparado.</p>
  <script src="shared/protocol.js"></script>
  <script src="popup.js"></script>
</body>
</html>
