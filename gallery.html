
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ext-Media · Galería del tema</title>
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="viewers/media-viewer.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Ext-Media</h1>
      <p id="summary">Cargando resultados de la sesión…</p>
    </div>
    <div class="actions">
      <button id="exportJson">JSON</button>
      <button id="exportCsv">CSV</button>
      <button id="copyUrls">Copiar URL</button>
      <button id="clear" class="danger">Limpiar</button>
    </div>
  </header>

  <nav id="filters" class="filters" aria-label="Filtrar recursos">
    <button data-filter="all" class="active">Todos <span class="count" data-count="all">0</span></button>
    <button data-filter="image">Imágenes <span class="count" data-count="image">0</span></button>
    <button data-filter="video">Videos <span class="count" data-count="video">0</span></button>
    <button data-filter="embed">Embeds <span class="count" data-count="embed">0</span></button>
    <button data-filter="telegram">Telegram <span class="count" data-count="telegram">0</span></button>
    <button data-filter="link">Enlaces <span class="count" data-count="link">0</span></button>
    <button data-filter="attachment">Adjuntos <span class="count" data-count="attachment">0</span></button>
  </nav>

  <p id="status" role="status"></p>
  <div class="pagination" aria-label="Paginación de resultados">
    <button id="prevPage" disabled>Anterior</button>
    <span id="pageInfo">Página 1</span>
    <button id="nextPage" disabled>Siguiente</button>
  </div>
  <main id="gallery" class="gallery"></main>
  <button id="scrollTop" class="scroll-top" type="button" aria-label="Volver al inicio" title="Volver al inicio">↑</button>

  <dialog id="mediaViewer" class="media-viewer" aria-label="Visor multimedia">
    <header class="viewer-toolbar">
      <div class="viewer-heading"><span id="viewerKind" class="viewer-kind">IMÁGENES</span><span id="viewerCounter" class="viewer-counter">0 / 0</span></div>
      <div class="viewer-tools">
        <button id="viewerZoom" type="button" title="Ampliar imagen" aria-label="Ampliar imagen">  <svg class="viewer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/>
    <path d="m20 20-4-4"/>
    <path d="M11 8v6M8 11h6"/>
  </svg></button>
        <button id="viewerFullscreen" type="button" title="Pantalla completa" aria-label="Pantalla completa">  <svg class="viewer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
    <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
    <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
  </svg></button>
        <button id="viewerClose" type="button" class="viewer-close" title="Cerrar" aria-label="Cerrar visor"><svg class="viewer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="m18 6-12 12M6 6l12 12"/>
  </svg></button>
      </div>
    </header>
    <button id="viewerPrev" class="viewer-arrow viewer-prev" type="button" aria-label="Anterior"><svg class="viewer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15 18-6-6 6-6"/>
  </svg></button>
    <section id="viewerStage" class="viewer-stage" aria-live="off"></section>
    <button id="viewerNext" class="viewer-arrow viewer-next" type="button" aria-label="Siguiente"><svg class="viewer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 18 6-6-6-6"/>
  </svg></button>
    <footer class="viewer-footer"><div id="viewerCaption" class="viewer-caption"></div><div id="viewerThumbs" class="viewer-thumbs" aria-label="Miniaturas"></div></footer>
  </dialog>

  <script src="shared/csv-export.js"></script>
  <script src="viewers/media-viewer.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
